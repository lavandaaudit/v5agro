# ==============================================================
# AGRO.MAGAZ — Hourly News Refresh
# ==============================================================
# Runs the RSS news parser every hour, commits the updated
# data/news_feed.json back to the repo, and lets GitHub Pages
# auto-deploy the fresh news feed.
#
# Manual dispatch is also available via the Actions tab.
# ==============================================================

name: 📰 Agro News Refresh

on:
  schedule:
    # Every hour at minute 5 (avoid the :00 GitHub Actions cron rush)
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even if no news changed'
        required: false
        default: 'false'

permissions:
  contents: write   # required for the automated commit

concurrency:
  group: news-refresh
  cancel-in-progress: false

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: 📰 Run news parser
        run: |
          python3 scripts/news_parser.py

      - name: 🔍 Verify output
        run: |
          if [ ! -f data/news_feed.json ]; then
            echo "❌ data/news_feed.json not created — aborting"
            exit 1
          fi
          echo "✅ news_feed.json generated:"
          python3 -c "
          import json
          with open('data/news_feed.json', 'r', encoding='utf-8') as f:
              d = json.load(f)
          print(f\"  updated_at: {d['updated_at']}\")
          print(f\"  UA items:   {d['ua_count']}\")
          print(f\"  EN items:   {d['en_count']}\")
          if d['ua_count'] + d['en_count'] == 0:
              print('⚠️  WARNING: zero news items — parser may be failing')
          "

      - name: 💾 Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only the news feed (avoid unrelated diffs)
          git add data/news_feed.json

          if git diff --cached --quiet; then
            if [ \"${{ github.event.inputs.force }}\" = \"true\" ]; then
              echo "Force mode: committing empty/no-change state anyway"
            else
              echo "ℹ️  No changes to news_feed.json — skipping commit"
              exit 0
            fi
          fi

          TS=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "📰 news: hourly refresh ${TS} (UA+EN 24h feed)"
          git push
          echo "✅ Pushed fresh news feed"

      - name: 📊 Summary
        if: always()
        run: |
          echo "### 📰 News Refresh Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f data/news_feed.json ]; then
            python3 -c "
            import json
            with open('data/news_feed.json', 'r', encoding='utf-8') as f:
                d = json.load(f)
            print(f'- **Updated:** {d[\"updated_at\"]}')
            print(f'- **UA news (24h):** {d[\"ua_count\"]}')
            print(f'- **EN news (24h):** {d[\"en_count\"]}')
            print()
            print('Top 5 UA:')
            for it in d['ua'][:5]:
                print(f\"  - [{it['hours_ago']:.1f}h] {it['source']}: {it['title'][:70]}\")
            print()
            print('Top 5 EN:')
            for it in d['en'][:5]:
                print(f\"  - [{it['hours_ago']:.1f}h] {it['source']}: {it['title'][:70]}\")
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Parser failed — no news_feed.json produced" >> $GITHUB_STEP_SUMMARY
          fi
