# ==============================================================
# AGRO.MAGAZ — Hourly News Refresh
# ==============================================================
# Runs the RSS news parser every hour, commits the updated
# data/news_feed.json back to the repo, and lets GitHub Pages
# auto-deploy the fresh news feed.
#
# Manual dispatch is also available via the Actions tab.
#
# v2 (2026-10-14): switched to actions/checkout@v5 (Node 24 native),
#                  use requirements.txt for deps, moved Python
#                  verification logic into scripts/verify_feed.py
#                  to eliminate the bash-heredoc escaping issues
#                  that were causing exit code 1 on the Summary step.
# ==============================================================

name: 📰 Agro News Refresh

on:
  schedule:
    # Every hour at minute 5 (avoid the :00 GitHub Actions cron rush)
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even if no news changed'
        required: false
        default: 'false'

permissions:
  contents: write   # required for the automated commit

concurrency:
  group: news-refresh
  cancel-in-progress: false

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        # v5 targets Node 24 natively — silences the Node 20→24 deprecation warning
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📰 Run news parser
        run: |
          python3 scripts/news_parser.py

      - name: 🔍 Verify output
        run: |
          python3 scripts/verify_feed.py

      - name: 💾 Commit & push if changed
        env:
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only the news feed (avoid unrelated diffs)
          git add data/news_feed.json

          if git diff --cached --quiet; then
            if [ "${FORCE_RUN}" = "true" ]; then
              echo "Force mode: committing empty/no-change state anyway"
            else
              echo "ℹ️  No changes to news_feed.json — skipping commit"
              exit 0
            fi
          fi

          TS=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "📰 news: hourly refresh ${TS} (UA+EN 24h feed)"
          git push
          echo "✅ Pushed fresh news feed"

      - name: 📊 Summary
        if: always()
        run: |
          python3 scripts/verify_feed.py --summary || \
            echo "❌ Parser failed — no news_feed.json produced" >> "$GITHUB_STEP_SUMMARY"
